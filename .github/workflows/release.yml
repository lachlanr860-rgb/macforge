name: Build DMG

# Every v* tag builds the app and DMG on GitHub's own macOS runner and attaches
# the result to that release, so the downloadable binary is the artifact of a
# public run rather than a file uploaded from someone's machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    name: Build MacForge.app and the DMG
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the app and the disk image
        run: bash app/build.sh --dmg

      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" app/Info.plist)
          TAG="v$VERSION"
          SHA=$(shasum -a 256 "dist/MacForge-$VERSION.dmg" | awk '{ print $1 }')
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "MacForge $VERSION" \
              --notes "Built by GitHub Actions from $GITHUB_SHA. SHA-256: $SHA"
          fi
          gh release upload "$TAG" "dist/MacForge-$VERSION.dmg" --clobber
          echo "SHA-256: $SHA"

      - name: Keep the DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacForge-dmg
          path: dist/*.dmg
          if-no-files-found: error
